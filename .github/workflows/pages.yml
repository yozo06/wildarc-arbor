name: Pages

# Publishes the phone version (data kept on the phone, no server) to GitHub Pages:
# https://yozo06.github.io/wildarc-arbor/
# The repository's Pages source must be set to "GitHub Actions" once, in Settings > Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npx vitest run

      - name: Build the phone version for /wildarc-arbor/
        run: npx vite build --base=/wildarc-arbor/

      # GitHub Pages answers unknown paths with 404.html; making it the app lets deep links open.
      - name: Let deep links open the app
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
